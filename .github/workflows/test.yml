name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.4'

defaults:
  run:
    shell: bash

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Tests
        run: npm test

      - name: Registry and event set
        run: |
          node --experimental-strip-types src/cli.ts check
          node --experimental-strip-types src/cli.ts validate-events
          node --experimental-strip-types src/cli.ts validate-timeline
          node --experimental-strip-types src/cli.ts validate-method
          node --experimental-strip-types src/cli.ts check-wording
