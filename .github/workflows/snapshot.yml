name: Daily snapshot

# Captures the day's TEFAS fund figures into archive/ (docs/sources/tefas.md).
# 03:00 UTC = 06:00 TR: TEFAS updates investor counts at the end of the day.
# About 36 minutes at one request per second.
#
# A failed snapshot writes nothing and the run turns red; GitHub e-mails the
# repository owner. A day that is lost stays empty, never filled in later.
#
# Until publication is approved (founder, 16 Nov 2026; plan task 1.13) this
# workflow has no schedule and must not be dispatched: capture runs
# privately on the maintainer's machine (tool/box/). When publication is
# approved, the schedule below goes back:
#
#   schedule:
#     - cron: '0 3 * * *'
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.4'

# With an explicit `bash`, GitHub runs with `-eo pipefail`, so an error in a
# pipe is not swallowed.
defaults:
  run:
    shell: bash

jobs:
  snapshot:
    name: TEFAS snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Tests
        run: npm test

      - name: Registry
        run: node --experimental-strip-types src/cli.ts check

      - name: Snapshot
        id: snapshot
        run: node --experimental-strip-types src/cli.ts snapshot

      - name: Validate archive
        id: validate
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types src/cli.ts validate-archive

      # Runs after a red snapshot too: a run with robots.txt-disallowed paths
      # writes its day and still fails. A snapshot that wrote nothing leaves
      # nothing to commit.
      - name: Commit
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m "Snapshot $(date -u +%F)"
          git push
